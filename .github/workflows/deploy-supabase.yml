name: Deploy Supabase RPC Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/rpc/**.sql'

jobs:
  deploy-rpc:
    name: Deploy RPC functions to Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy RPC functions
        run: |
          # Deploy all function files (CREATE OR REPLACE — idempotent, safe to re-run)
          # Excludes seed_airline_baggage_fees.sql (data, not a function)
          for file in supabase/rpc/*.sql; do
            name=$(basename "$file")
            if [ "$name" = "seed_airline_baggage_fees.sql" ]; then
              echo "Skipping seed file: $name"
              continue
            fi
            echo "Deploying: $name"
            supabase db execute --file "$file"
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
