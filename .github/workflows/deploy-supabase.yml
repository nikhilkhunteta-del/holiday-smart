name: Deploy Supabase RPC Functions and Tables

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/rpc/**.sql'
      - 'supabase/tables/**.sql'
  workflow_dispatch:

jobs:
  deploy-rpc:
    name: Deploy RPC functions and tables to Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy tables
        run: |
          # Table DDL — CREATE TABLE/INDEX IF NOT EXISTS, idempotent, safe to
          # re-run. Deployed before RPC functions since functions may query
          # these tables (none do yet, but keeps ordering deliberate).
          if [ -d supabase/tables ]; then
            for file in supabase/tables/*.sql; do
              [ -e "$file" ] || continue
              echo "Deploying: $file"
              supabase db query --linked --file "$file"
            done
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy RPC functions
        run: |
          # Deploy all function files (CREATE OR REPLACE — idempotent, safe to re-run)
          # Excludes seed_airline_baggage_fees.sql (data, not a function)
          for file in supabase/rpc/*.sql; do
            name=$(basename "$file")
            if [ "$name" = "seed_airline_baggage_fees.sql" ]; then
              echo "Skipping seed file: $name"
              continue
            fi
            echo "Deploying: $name"
            supabase db query --linked --file "$file"
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
