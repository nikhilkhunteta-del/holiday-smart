<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Results — Holiday Smart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-surface-container-lowest: #ffffff;
      --color-surface-container-low:    #f2f4f4;
      --color-outline-variant:          #bfc8c9;
      --color-outline:                  #6f797a;
      --color-on-surface:               #191c1d;
      --color-on-surface-variant:       #3f484a;
      --color-primary:                  #004349;
      --color-primary-container:        #0d5c63;
      --color-on-primary:               #ffffff;
      --color-secondary-container:      #fdba49;
      --color-on-secondary-container:   #704b00;
      --color-background:               #f8fafa;

      --background:         var(--color-background);
      --surface:            var(--color-surface-container-lowest);
      --primary:            var(--color-primary);
      --primary-container:  var(--color-primary-container);
      --on-primary:         var(--color-on-primary);
      --on-surface:         var(--color-on-surface);
      --on-surface-variant: var(--color-on-surface-variant);
      --outline:            var(--color-outline);
      --outline-variant:    var(--color-outline-variant);

      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 48px;

      --radius-md: 0.75rem;
      --radius-lg: 1rem;

      --shadow-sm: 0 2px 4px rgba(13,92,99,0.08);
      --shadow-md: 0 8px 16px rgba(13,92,99,0.08);
    }

    body {
      background: var(--background);
      color: var(--on-surface);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Nav ── */
    nav {
      max-width: 1280px;
      margin: 0 auto;
      padding: var(--space-lg) 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      font-family: 'Newsreader', serif;
      font-size: 22px;
      font-weight: 500;
      color: var(--primary);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: var(--space-xl);
      list-style: none;
    }

    .nav-links a {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--on-surface-variant);
      text-decoration: none;
    }

    .nav-links a:hover { color: var(--primary); }

    /* ── Main ── */
    main {
      flex: 1;
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
      padding: var(--space-xl) 64px calc(var(--space-xl) * 2);
    }

    .page-eyebrow {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--primary-container);
      display: block;
      margin-bottom: var(--space-md);
    }

    .page-heading {
      font-family: 'Newsreader', serif;
      font-size: 36px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.01em;
      color: var(--on-surface);
      margin-bottom: var(--space-xl);
    }

    /* ── Selection summary card ── */
    .summary-card {
      background: var(--surface);
      border: 1px solid var(--outline-variant);
      border-radius: var(--radius-lg);
      padding: var(--space-lg);
      box-shadow: var(--shadow-sm);
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .summary-card-title {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--outline);
    }

    .summary-divider {
      height: 1px;
      background: var(--outline-variant);
    }

    .summary-row {
      display: flex;
      gap: var(--space-md);
    }

    .summary-label {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--outline);
      min-width: 80px;
      padding-top: 2px;
    }

    .summary-value {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 400;
      color: var(--on-surface);
    }

    .summary-value strong {
      font-weight: 600;
      color: var(--primary);
    }

    .missing-param {
      font-style: italic;
      color: var(--outline);
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--outline-variant);
      margin-top: auto;
    }

    .footer-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: var(--space-xl) 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-xl);
    }

    .footer-logo {
      font-family: 'Newsreader', serif;
      font-size: 22px;
      font-weight: 500;
      color: var(--primary);
      text-decoration: none;
    }

    .footer-links {
      display: flex;
      gap: var(--space-lg);
      list-style: none;
      flex-wrap: wrap;
    }

    .footer-links a {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 400;
      color: var(--on-surface-variant);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .footer-links a:hover { color: var(--primary); }

    .footer-bottom { border-top: 1px solid var(--outline-variant); }

    .footer-bottom-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: var(--space-md) 64px;
    }

    .footer-legal {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: var(--outline);
    }

    @media (max-width: 900px) {
      nav, main { padding-left: var(--space-lg); padding-right: var(--space-lg); }
      .footer-inner { flex-direction: column; align-items: flex-start; padding: var(--space-xl) var(--space-lg); gap: var(--space-lg); }
      .footer-bottom-inner { padding: var(--space-md) var(--space-lg); }
      .nav-links { display: none; }
    }
  </style>
</head>
<body>

  <nav>
    <a class="nav-logo" href="/">Holiday Smart</a>
    <ul class="nav-links">
      <li><a href="/#how-it-works">How it works</a></li>
      <li><a href="#">Sign in</a></li>
    </ul>
  </nav>

  <main>
    <span class="page-eyebrow">Results</span>
    <h1 class="page-heading">Results coming soon</h1>

    <div class="summary-card" id="summary-card">
      <p class="summary-card-title">Your selection</p>
      <div class="summary-divider"></div>
      <div id="summary-rows"></div>
    </div>
  </main>

  <footer>
    <div class="footer-inner">
      <a class="footer-logo" href="/">Holiday Smart</a>
      <ul class="footer-links">
        <li><a href="#">About Us</a></li>
        <li><a href="#">Privacy Policy</a></li>
        <li><a href="#">Holiday Calendar</a></li>
        <li><a href="#">Contact Support</a></li>
      </ul>
    </div>
    <div class="footer-bottom">
      <div class="footer-bottom-inner">
        <span class="footer-legal">© 2026 Smart Travel Planning.</span>
      </div>
    </div>
  </footer>

  <script>
    const p = new URLSearchParams(window.location.search);

    const school  = p.get('school')  || null;
    const urn     = p.get('urn')     || null;
    const borough = p.get('borough') || null;
    const brk     = p.get('break')   || null;
    const start   = p.get('start')   || null;
    const end     = p.get('end')     || null;

    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    function fmtDate(str) {
      if (!str) return null;
      const d = new Date(str);
      return `${d.getDate()} ${MONTHS[d.getMonth()]}`;
    }

    function row(label, value) {
      const missing = !value || value.trim() === '';
      return `<div class="summary-row">
        <span class="summary-label">${label}</span>
        <span class="summary-value">${missing ? '<span class="missing-param">—</span>' : `<strong>${value}</strong>`}</span>
      </div>`;
    }

    const dateStr = (start && end)
      ? `${fmtDate(start)} – ${fmtDate(end)}`
      : null;

    const rows = [
      school  ? row('School',  school)  : null,
      !school && urn ? row('URN', urn)  : null,
      row('Borough', borough),
      row('Break',   brk),
      row('Dates',   dateStr),
    ].filter(Boolean).join('');

    document.getElementById('summary-rows').innerHTML = rows || '<p class="missing-param" style="font-size:14px">No parameters received.</p>';
  </script>

</body>
</html>
